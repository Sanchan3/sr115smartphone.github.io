<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>かわいく変声！ポップスターPWA</title>
  <!-- PWA設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFC0CB">
  
  <style>
    /* 簡易的なポップデザインCSS */
    body {
      background-color: #FFEDF6; /* パステルピンク */
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #FF69B4; font-size: 1.5rem; text-shadow: 1px 1px 0 #FFF; }
    #start-btn {
      background-color: #B0E0E6; /* パステル水色 */
      border: 5px solid #FFF;
      color: #FFF;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 20px 40px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 0 #FFF;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    #start-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #FFF;
    }
    #start-btn:disabled {
      background-color: #CCC;
      cursor: default;
    }
    .warning { color: red; font-size: 0.8rem; margin-top: 20px;}
  </style>
</head>
<body>
  <h1>かわいく変声！<br>ポップスターPWA</h1>
  
  <button id="start-btn">変声スタート！⭐</button>
  <p class="warning">※必ずイヤホンを付けてから押してね！キーンって鳴っちゃうよ！</p>

  <script>
    // 1. Service Workerの登録
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW登録成功!', reg))
          .catch(err => console.log('SW登録失敗...', err));
      });
    }

    // 2. 音声処理ロジック (前のターンのそのまま)
    document.getElementById('start-btn').addEventListener('click', async () => {
      try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });

        await audioContext.audioWorklet.addModule('processor.js');
        const source = audioContext.createMediaStreamSource(stream);
        const workletNode = new AudioWorkletNode(audioContext, 'pass-through-processor');

        source.connect(workletNode);
        workletNode.connect(audioContext.destination);

        document.getElementById('start-btn').disabled = true;
        document.getElementById('start-btn').textContent = "動作中！🎵";

      } catch (err) {
        console.error(err);
        alert('マイクが使えません...');
      }
    });
  </script>
</body>
</html>
